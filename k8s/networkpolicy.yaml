apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopping-list-network
  namespace: shopping-list
spec:
  podSelector: {}      # applies to all pods in namespace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic between pods in the namespace
    - from:
        - podSelector: {}
    # Allow ingress controller traffic to the API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 5678
          protocol: TCP
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow pods to talk to each other
    - to:
        - podSelector: {}
    # Allow outbound SMTP (email verification)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 587
          protocol: TCP
    # Allow outbound HTTPS (Firebase, OAuth providers)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
