apiVersion: v1
kind: ConfigMap
metadata:
  name: shoppinglist-api-config
  namespace: shoppinglist-api
data:
  # ── Hosting ───────────────────────────────────────────────────────────────
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://0.0.0.0:5678"
  # Nothing to redirect to: TLS is terminated by Traefik in front of the pod.
  AppSettings__UseHttpsRedirect: "False"

  # ── Storage ───────────────────────────────────────────────────────────────
  # Paths are relative to the working directory (/app) and backed by a PVC.
  AppSettings__DataStorageFolder: "data"
  AppSettings__UserStorageFolder: "user"

  # ── Database (PostgreSQL container "shoppinglist-api-postgres") ───────────
  AppSettings__UseDocker: "True"
  AppSettings__DbServerAddressDocker: "Host=shoppinglist-api-postgres;Port=5432;"
  AppSettings__DbName: "shoppinglistserver"
  AppSettings__DbUser: "shoppinglist"

  # ── E-mail (password comes from the Secret) ───────────────────────────────
  AppSettings__NoReplyEMailHost: "smtp.1und1.de"
  AppSettings__NoReplyEMailPort: "587"
  AppSettings__NoReplyEMailAddress: "noreply@shopping-now.net"

  # ── Apple sign-in ─────────────────────────────────────────────────────────
  AppSettings__AppleClientID: "GenericListApp.iOS.app"
  AppSettings__AppleTeamId: "REPLACE_WITH_APPLE_TEAM_ID"
  AppSettings__AppleSignInKeyId: "REPLACE_WITH_APPLE_KEY_ID"
  AppSettings__AppleSignInP8SecretPath: "auth/AuthKey_REPLACE_WITH_APPLE_KEY_ID.p8"

  # ── Optional integrations (left disabled) ─────────────────────────────────
  UseFirebase: "false"
