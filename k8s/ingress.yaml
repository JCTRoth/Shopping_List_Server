apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shoppinglist-api-ingress
  namespace: shoppinglist-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.shopping-now.net
      secretName: shoppinglist-api-tls-cert
  rules:
    - host: api.shopping-now.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shoppinglist-api-service
                port:
                  number: 80
