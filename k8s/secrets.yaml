  jwt-secret: "CHANGE_ME_random_64_char_string"
  db-password: "CHANGE_ME_secure_db_password"
  db-root-password: "CHANGE_ME_secure_root_password"
  email-password: "CHANGE_ME_email_password"
  facebook-app-id: ""
  apple-key-id: ""
  apple-team-id: ""
