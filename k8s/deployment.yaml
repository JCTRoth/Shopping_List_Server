apiVersion: v1
kind: Service
metadata:
  name: shopping-list-server
  namespace: shopping-list
  labels:
    app.kubernetes.io/name: shopping-list-server
    app.kubernetes.io/part-of: shopping-list-server
spec:
  type: ClusterIP
  ports:
    - port: 5678
      targetPort: 5678
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: shopping-list-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-list-server
  namespace: shopping-list
  labels:
    app.kubernetes.io/name: shopping-list-server
    app.kubernetes.io/part-of: shopping-list-server
spec:
  replicas: 1          # ← keep 1 unless you move to shared storage for /app/data
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shopping-list-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopping-list-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # Wait for MySQL to be reachable before starting the app
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL..."
                sleep 2
              done
      containers:
        - name: api
          image: shoppinglistserver:latest    # replace with your registry, e.g. ghcr.io/user/shopping-list-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
          env:
            # --- Secrets ---
            - name: AppSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: shopping-list-secrets
                  key: jwt-secret
            - name: AppSettings__DbPassword
              valueFrom:
                secretKeyRef:
                  name: shopping-list-secrets
                  key: db-password
            - name: AppSettings__NoReplyEMailPassword
              valueFrom:
                secretKeyRef:
                  name: shopping-list-secrets
                  key: email-password
            - name: AppSettings__FacebookAppID
              valueFrom:
                secretKeyRef:
                  name: shopping-list-secrets
                  key: facebook-app-id
            - name: AppSettings__AppleSignInKeyId
              valueFrom:
                secretKeyRef:
                  name: shopping-list-secrets
                  key: apple-key-id
            - name: AppSettings__AppleTeamId
              valueFrom:
                secretKeyRef:
                  name: shopping-list-secrets
                  key: apple-team-id
            # --- ConfigMap ---
            - name: AppSettings__DbServerAddressDocker
              value: "server=mysql;port=3306;"
            - name: AppSettings__DbName
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: DB_NAME
            - name: AppSettings__DbUser
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: DB_USER
            - name: AppSettings__UseDocker
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: USE_DOCKER
            - name: AppSettings__UseHttpsRedirect
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: USE_HTTPS_REDIRECT
            - name: UseFirebase
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: USE_FIREBASE
            - name: AppSettings__NoReplyEMailHost
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: NOREPLY_EMAIL_HOST
            - name: AppSettings__NoReplyEMailPort
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: NOREPLY_EMAIL_PORT
            - name: AppSettings__NoReplyEMailAddress
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: NOREPLY_EMAIL_ADDRESS
            - name: AppSettings__AppleClientID
              valueFrom:
                configMapKeyRef:
                  name: shopping-list-config
                  key: APPLE_CLIENT_ID
          volumeMounts:
            - name: shopping-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /users/test
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /users/test
              port: 5678
            initialDelaySeconds: 20
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /users/test
              port: 5678
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: shopping-data
          persistentVolumeClaim:
            claimName: shopping-data
