apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppinglist-api
  namespace: shoppinglist-api
  labels:
    app: shoppinglist-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate # the API is stateless: lists live in PostgreSQL, pictures in MinIO
  selector:
    matchLabels:
      app: shoppinglist-api
  template:
    metadata:
      labels:
        app: shoppinglist-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # The API applies EF Core migrations on startup, so the database must be
      # reachable before the container starts.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z shoppinglist-api-postgres 5432; do echo "Waiting for PostgreSQL..."; sleep 3; done
        # Object storage is optional for list traffic, but starting after it exists
        # avoids the API's bucket-creation retry loop on a cold deploy.
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z minio 9000; do echo "Waiting for MinIO..."; sleep 3; done
      containers:
        - name: app
          image: ghcr.io/danielroth1/shoppinglist-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5678
          envFrom:
            - configMapRef:
                name: shoppinglist-api-config
          env:
            - name: AppSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: shoppinglist-api-secrets
                  key: AppSettings__Secret
            - name: AppSettings__DbPassword
              valueFrom:
                secretKeyRef:
                  name: shoppinglist-api-secrets
                  key: AppSettings__DbPassword
            - name: AppSettings__NoReplyEMailPassword
              valueFrom:
                secretKeyRef:
                  name: shoppinglist-api-secrets
                  key: AppSettings__NoReplyEMailPassword
            - name: AppSettings__ObjectStorage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: shoppinglist-api-secrets
                  key: AppSettings__ObjectStorage__AccessKey
            - name: AppSettings__ObjectStorage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: shoppinglist-api-secrets
                  key: AppSettings__ObjectStorage__SecretKey
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          # Startup runs the DB migrations, so allow generous time before
          # the liveness probe starts counting failures.
          startupProbe:
            tcpSocket:
              port: 5678
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 5678
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5678
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
