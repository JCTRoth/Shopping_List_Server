services:
  db:
    platform: linux/x86_64
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shoppinglistserver
      POSTGRES_USER: shoppinglist
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      # Published on the loopback interface only, so an API run from source on the
      # host (`local: start`) can use this database. Not exposed to the network.
      - 127.0.0.1:5432:5432
    restart: always

  shoppinglistserver:
    depends_on:
      - db
      - minio
    image: shoppinglistserver
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      # Inside the container the store is reachable by service name; clients use localhost.
      AppSettings__ObjectStorage__InternalServiceUrl: http://minio:9000
      AppSettings__ObjectStorage__PublicServiceUrl: http://localhost:9000
    volumes: # mount the ssl certificate files folder in the docker image
        - "/etc/timezone:/etc/timezone:ro"
        - "/etc/localtime:/etc/localtime:ro"
        - type: bind
          source: /etc/letsencrypt/kestrel/ # this folder contains the certificat files
          target: /app/auth/cert-files/
        - type: bind
          source: /etc/letsencrypt/apple-keys/ # this folder contains apple keys
          target: /app/auth/
    ports:
      - 5678:5678

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-shoppinglist}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sl_dev_minio_pw_2026}
      # The API answers avatar reads with a 302 to a pre-signed URL, so the browser
      # fetches the picture straight from this service: the dev origins must be allowed.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:5173,http://localhost:5173,https://shopping-now.net,capacitor://localhost,http://localhost"
    volumes:
      - miniodata:/data
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    restart: always

  adminer:
    image: adminer:4
    depends_on:
      - db
    ports:
      - 127.0.0.1:8080:8080
    restart: always

volumes:
  dbdata:
  miniodata: